---
driver:
  name: exec

transport:
  name: exec

provisioner:
  name: chef_infra
  chef_omnibus_install: false
  sudo: true
  policyfile: Policyfile.rb

verifier:
  name: inspec

platforms:
  - name: ubuntu-latest

suites:
  - name: default
    provisioner:
      named_run_list: default
    verifier:
      inspec_tests:
        - test/integration/default
